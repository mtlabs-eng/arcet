name: release

# Fires on a version tag. Building and publishing are separate jobs so that a
# failed publish never leaves a half-made GitHub release behind, and so the
# artefacts that go to PyPI are byte-for-byte the ones attached to the release.
on:
  push:
    tags: ["v*"]
  # Lets the build and its checks be exercised without a tag. Publishing is
  # guarded on the ref below, so a manual run can never release anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # A tag that does not match the version in pyproject.toml would publish
      # something under a name nobody can trace back. Cheaper to stop here.
      - name: the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run --no-project python -c 'import tomllib,pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag packaged=$packaged"
          test "$tag" = "$packaged"

      - name: install
        run: uv sync --locked --all-groups

      # The suite has to be green at the tagged commit, not merely at some
      # commit on main before it.
      - name: pytest
        run: uv run pytest --cov --cov-report=term

      - name: build
        run: uv build

      - name: the wheel installs and runs
        run: |
          uv venv /tmp/check
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl
          /tmp/check/bin/arcet --version

      - name: checksums
        run: cd dist && sha256sum arcet-* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    name: github release
    needs: build
    # Only a tag releases. A manual run stops after build, so the workflow can
    # be exercised without putting anything in front of anyone.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only write permission in this repository, and only here
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Anything carrying a pre-release suffix is marked as such, so GitHub
      # never advertises an alpha as the latest release.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *a*|*b*|*rc*|*dev*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "arcet ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG](https://github.com/${GH_REPO}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            $prerelease \
            dist/*

  pypi:
    name: pypi
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted publishing: GitHub mints a short-lived OIDC token for this
    # repository, this workflow and this environment, and PyPI accepts it
    # because that combination is registered as a publisher. There is no API
    # token to store, to leak, or to remember to rotate.
    #
    # 0.1.0a2 went out with an account-scoped token, because PyPI cannot mint a
    # project-scoped one for a project that does not exist yet. That token was
    # the widest-reaching credential in the repository, in a tool whose whole
    # argument is that it holds no credentials and writes nothing.
    #
    # The `pypi` environment still carries a required reviewer, so a pushed tag
    # cannot publish on its own.
    environment:
      name: pypi
      url: https://pypi.org/p/arcet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # SHA256SUMS is for the GitHub release, not for the index.
      - name: keep only distributions
        run: rm -f dist/SHA256SUMS

      # No `password:`. The action detects the OIDC token from id-token: write
      # and exchanges it with PyPI itself.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
