[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcet"
version = "0.1.0a1"
description = "Effective Azure permissions, with the derivation chain that explains them."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Marco Tomas" }]
keywords = ["azure", "rbac", "permissions", "iam", "pim", "entra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "azure-identity>=1.17",
    "azure-mgmt-authorization>=4.0",
    # rich is a typer dependency, but the renderers import it directly, so it
    # is declared rather than relied on transitively.
    "rich>=13",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/mtlabs-eng/arcet"
Source = "https://github.com/mtlabs-eng/arcet"
Issues = "https://github.com/mtlabs-eng/arcet/issues"

[project.scripts]
arcet = "arcet.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/arcet"]

[tool.hatch.build.targets.sdist]
# The brand reference is 932 KB of artwork that nothing needs in order to
# build or run arcet. Shipping it would make the source distribution twenty
# times larger than the wheel, which is a poor look on a tool whose argument
# is that it keeps its footprint small.
exclude = ["/design"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",   # shadowing builtins — the reason UnsupportedConstruct is not called Warning
    "B",   # bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "PTH", # use pathlib
    "RET", # return consistency
    "RUF",
    "SIM", # simplify
    "TID", # tidy imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/arcet"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# The gate applies to the modules where the judgement lives. reader.py is the
# thin layer that only fetches, and it cannot be covered without a tenant —
# covering it with mocks would test the mocks. Its correctness is established
# by running arcet for real, which is a different exercise and is reported in
# the README rather than pretended at here.
omit = ["src/arcet/reader.py", "src/arcet/__main__.py"]
# Currently 95%. The floor sits just below, so an ordinary change does not
# trip it and a module quietly losing its tests does.
fail_under = 93
show_missing = true
